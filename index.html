<style>
  #game-shell {
    position: relative;
    width: 100%;
    height: 740px;
    min-height: 520px;
    overflow: hidden;
    isolation: isolate;
    background: #111827;
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 14px;
    user-select: none;
    -webkit-user-select: none;
  }
  #game-shell * { box-sizing: border-box; }
  #game {
    position: absolute;
    inset: 0;
    display: block;
    width: 100%;
    height: 100%;
    outline: none;
  }
  #game-crosshair {
    position: absolute;
    z-index: 6;
    left: 50%;
    top: 50%;
    width: 26px;
    height: 26px;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }
  #game-crosshair span {
    position: absolute;
    display: block;
    background: rgba(255,255,255,.96);
    border: 1px solid rgba(10,15,25,.82);
    box-shadow: 0 0 2px rgba(0,0,0,.85);
    border-radius: 1px;
  }
  #game-crosshair .top, #game-crosshair .bottom {
    width: 2px; height: 7px; left: 12px;
  }
  #game-crosshair .top { top: 0; }
  #game-crosshair .bottom { bottom: 0; }
  #game-crosshair .left, #game-crosshair .right {
    width: 7px; height: 2px; top: 12px;
  }
  #game-crosshair .left { left: 0; }
  #game-crosshair .right { right: 0; }
  #game-crosshair .center {
    width: 3px; height: 3px; left: 11.5px; top: 11.5px;
    border-radius: 50%;
  }
  #game-hud {
    position: absolute;
    top: 14px;
    left: 14px;
    z-index: 5;
    color: #fff;
    background: rgba(0,0,0,.58);
    padding: 12px 15px;
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 12px;
    line-height: 1.65;
    font-size: 13px;
    backdrop-filter: blur(5px);
    pointer-events: none;
  }
  #game-hud h2 { margin: 0 0 5px; font-size: 16px; }
  #game-position { color: #a7f3d0; }
  #game-hits { color: #fca5a5; font-weight: 700; }
  #game-help {
    position: absolute;
    z-index: 5;
    bottom: 14px;
    left: 50%;
    transform: translateX(-50%);
    color: #fff;
    background: rgba(0,0,0,.58);
    border: 1px solid rgba(255,255,255,.12);
    padding: 9px 14px;
    border-radius: 10px;
    font-size: 12px;
    white-space: nowrap;
    text-align: center;
    pointer-events: none;
  }
  #game-overlay {
    position: absolute;
    inset: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    color: #fff;
    background: rgba(5,10,20,.72);
    backdrop-filter: blur(5px);
  }
  #game-overlay[hidden] { display: none !important; }
  #game-overlay-panel {
    width: min(440px, 100%);
    padding: 28px 26px;
    text-align: center;
    background: rgba(17,29,48,.96);
    border: 1px solid rgba(255,255,255,.16);
    border-radius: 18px;
    box-shadow: 0 18px 60px rgba(0,0,0,.35);
  }
  #game-overlay-kicker {
    display: inline-block;
    margin-bottom: 12px;
    padding: 5px 10px;
    color: #a7f3d0;
    background: rgba(16,185,129,.13);
    border: 1px solid rgba(167,243,208,.22);
    border-radius: 999px;
    font-size: 11px;
    letter-spacing: .08em;
  }
  #game-overlay-title { margin: 0 0 10px; font-size: 25px; }
  #game-overlay-message {
    margin: 0 0 12px;
    color: #d1d5db;
    font-size: 14px;
    line-height: 1.65;
  }
  #game-overlay-note {
    display: block;
    margin-top: 10px;
    color: #9ca3af;
    font-size: 12px;
    line-height: 1.6;
  }
  @media (max-width: 600px) {
    #game-shell { height: 680px; min-height: 480px; }
    #game-help { white-space: normal; width: calc(100% - 28px); line-height: 1.5; }
    #game-hud { font-size: 12px; }
  }
</style>

<div id="game-shell">
  <canvas id="game" tabindex="0" aria-label="3D first person game"></canvas>
  <div id="game-crosshair" aria-hidden="true">
    <span class="top"></span>
    <span class="bottom"></span>
    <span class="left"></span>
    <span class="right"></span>
    <span class="center"></span>
  </div>

  <div id="game-hud">
    <h2>🎮 3D WORLD · FPS</h2>
    <div>이동: WASD</div>
    <div>시점 조정: 방향키</div>
    <div>조준: 화면 중앙 조준선</div>
    <div>점프: SPACE</div>
    <div>공격: ENTER</div>
    <div>일시정지: ESC</div>
    <div>명중: <span id="game-hits">0</span></div>
    <div id="game-position">위치: 0.0, 0.0</div>
  </div>

  <div id="game-help">WASD 이동 · 방향키 시점 조정 · SPACE 점프 · 조준선에 조준 후 ENTER 발사 · ESC 일시정지</div>

  <div id="game-overlay" role="dialog" aria-modal="true" aria-labelledby="game-overlay-title">
    <div id="game-overlay-panel">
      <div id="game-overlay-kicker">3D FIRST PERSON WORLD</div>
      <h2 id="game-overlay-title">게임을 시작할까요?</h2>
      <p id="game-overlay-message">P 키를 눌러 게임을 시작하세요.</p>
      <small id="game-overlay-note">WASD 이동 · 방향키 시점 조정 · SPACE 점프 · 조준선에 조준 후 ENTER 발사 · ESC 일시정지</small>
    </div>
  </div>
</div>

<script>
(() => {
  'use strict';

  const shell = document.getElementById('game-shell');
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const positionLabel = document.getElementById('game-position');
  const hitsLabel = document.getElementById('game-hits');
  const overlay = document.getElementById('game-overlay');
  const overlayTitle = document.getElementById('game-overlay-title');
  const overlayMessage = document.getElementById('game-overlay-message');
  const overlayNote = document.getElementById('game-overlay-note');

  let width = 0;
  let height = 0;
  let dpr = 1;
  let gameState = 'ready'; // ready | playing | paused
  let hits = 0;

  function resize() {
    const rect = shell.getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    width = Math.max(1, rect.width);
    height = Math.max(1, rect.height);
    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  if (typeof ResizeObserver !== 'undefined') {
    new ResizeObserver(resize).observe(shell);
  }
  window.addEventListener('resize', resize);
  resize();

  const player = {
    x: 0,
    z: 0,
    y: 0,
    vy: 0,
    speed: 6.0,
    grounded: true
  };

  // yaw=0이면 -Z 방향을 바라봅니다. pitch가 양수면 아래를 바라봅니다.
  const camera = {
    yaw: 0,
    pitch: 0.17,
    eyeHeight: 1.65,
    // 방향키 입력은 부드럽게 가속·감속시켜 카메라 움직임을 자연스럽게 만듭니다.
    turnSpeed: 2.0,
    lookSpeed: 1.65,
    yawVelocity: 0,
    pitchVelocity: 0,
    rotationResponse: 11
  };

  const keys = Object.create(null);
  const controlCodes = new Set([
    'KeyW', 'KeyA', 'KeyS', 'KeyD', 'KeyP',
    'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight',
    'Space', 'Enter', 'Escape'
  ]);

  function clearKeys() {
    for (const key of Object.keys(keys)) keys[key] = false;
    // 일시정지나 창 전환 직후 카메라가 관성으로 계속 회전하지 않게 합니다.
    camera.yawVelocity = 0;
    camera.pitchVelocity = 0;
  }

  function showOverlay(mode) {
    overlay.hidden = false;
    if (mode === 'ready') {
      overlayTitle.textContent = '게임을 시작할까요?';
      overlayMessage.textContent = 'P 키를 눌러 게임을 시작하세요.';
      overlayNote.textContent = 'WASD 이동 · 방향키 시점 조정 · SPACE 점프 · ENTER 공격 · ESC 일시정지';
    } else {
      overlayTitle.textContent = '일시정지';
      overlayMessage.textContent = '게임이 멈췄습니다. P 키를 누르면 이어서 플레이합니다.';
      overlayNote.textContent = '화면 중앙 조준선으로 조준하세요. ENTER는 발사, P는 재개입니다.';
    }
  }

  function startGame() {
    clearKeys();
    gameState = 'playing';
    overlay.hidden = true;
  }

  function pauseGame() {
    if (gameState !== 'playing') return;
    gameState = 'paused';
    clearKeys();
    showOverlay('paused');
  }

  // ------------------------------------------------------------
  // 월드 오브젝트와 투사체
  // ------------------------------------------------------------
  const palette = ['#e85d75', '#55aaff', '#f5c542', '#9b72cf', '#38bdf8', '#fb923c'];
  const objects = [];
  for (let i = 0; i < 42; i++) {
    let x, z;
    do {
      x = (Math.random() - 0.5) * 58;
      z = (Math.random() - 0.5) * 58;
    } while (Math.hypot(x, z) < 7);
    objects.push({
      x,
      z,
      size: 0.9 + Math.random() * 1.8,
      color: palette[i % palette.length]
    });
  }

  const projectiles = [];
  const projectileSpeed = 26;
  const projectileRadius = 0.16;
  const projectileCooldown = 0.2;
  let fireCooldown = 0;

  function getCameraForward() {
    // 투사체도 화면 투영에 사용하는 카메라 forward 축과 정확히 같은 방향으로 발사합니다.
    return getCameraBasis().forward;
  }

  function fireProjectile() {
    if (fireCooldown > 0) return;
    const direction = getCameraForward();
    const startDistance = 0.75;
    const startX = player.x + direction.x * startDistance;
    const startY = player.y + camera.eyeHeight + direction.y * startDistance;
    const startZ = player.z + direction.z * startDistance;

    projectiles.push({
      x: startX,
      y: startY,
      z: startZ,
      previousX: startX,
      previousY: startY,
      previousZ: startZ,
      vx: direction.x * projectileSpeed,
      vy: direction.y * projectileSpeed,
      vz: direction.z * projectileSpeed,
      life: 3.5
    });
    fireCooldown = projectileCooldown;
  }

  document.addEventListener('keydown', (event) => {
    if (controlCodes.has(event.code)) event.preventDefault();

    if (event.code === 'Escape') {
      if (gameState === 'playing') pauseGame();
      return;
    }

    if (gameState !== 'playing') {
      if (event.code === 'KeyP' && !event.repeat) startGame();
      return;
    }

    if (event.code === 'Enter') {
      if (!event.repeat) fireProjectile();
      return;
    }

    keys[event.code] = true;

    if (event.code === 'Space' && !event.repeat && player.grounded) {
      player.vy = 7.2;
      player.grounded = false;
    }
  });

  document.addEventListener('keyup', (event) => {
    keys[event.code] = false;
  });

  window.addEventListener('blur', clearKeys);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && gameState === 'playing') pauseGame();
  });

  // ------------------------------------------------------------
  // 카메라 좌표와 원근 투영
  // ------------------------------------------------------------
  // 카메라의 세 축을 먼저 만든 뒤, 월드 좌표를 각 축에 투영합니다.
  // right / up / forward가 서로 직교하도록 구성해 화면이 비틀리거나 기울어지는
  // 현상을 막습니다. yaw는 수평 회전, pitch는 카메라의 오른쪽 축 기준 상하 회전입니다.
  function getCameraBasis() {
    const sy = Math.sin(camera.yaw);
    const cy = Math.cos(camera.yaw);
    const sp = Math.sin(camera.pitch);
    const cp = Math.cos(camera.pitch);

    return {
      right:   { x: cy,      y: 0,   z: sy },
      up:      { x: sy * sp, y: cp,  z: -cy * sp },
      forward: { x: sy * cp, y: -sp, z: -cy * cp }
    };
  }

  function cameraSpace(x, y, z) {
    const dx = x - player.x;
    const dy = y - (player.y + camera.eyeHeight);
    const dz = z - player.z;
    const basis = getCameraBasis();

    // 각 축의 내적(dot product)으로 카메라 좌표를 구합니다.
    const right = dx * basis.right.x + dy * basis.right.y + dz * basis.right.z;
    const up = dx * basis.up.x + dy * basis.up.y + dz * basis.up.z;
    const depth = dx * basis.forward.x + dy * basis.forward.y + dz * basis.forward.z;
    return { right, up, depth };
  }

  function projectCameraPoint(point) {
    if (point.depth <= 0.12) return null;
    const focal = height / (2 * Math.tan(70 * Math.PI / 360));
    const scale = focal / point.depth;
    return {
      x: width / 2 + point.right * scale,
      y: height / 2 - point.up * scale,
      depth: point.depth,
      scale
    };
  }

  function project(x, y, z) {
    return projectCameraPoint(cameraSpace(x, y, z));
  }

  // 카메라 뒤에 일부가 걸린 바닥도 near plane에서 잘라서 그립니다.
  function clipPolygonToNearPlane(vertices, near = 0.12) {
    let output = vertices;
    const input = output;
    output = [];
    if (input.length === 0) return output;

    let previous = input[input.length - 1];
    let previousInside = previous.depth > near;

    for (const current of input) {
      const currentInside = current.depth > near;
      if (currentInside !== previousInside) {
        const denominator = current.depth - previous.depth;
        if (Math.abs(denominator) > 1e-9) {
          const t = (near - previous.depth) / denominator;
          output.push({
            right: previous.right + (current.right - previous.right) * t,
            up: previous.up + (current.up - previous.up) * t,
            depth: near + 0.001
          });
        }
      }
      if (currentInside) output.push(current);
      previous = current;
      previousInside = currentInside;
    }
    return output;
  }

  function drawLine3D(a, b, color, lineWidth = 1) {
    let p1 = cameraSpace(a[0], a[1], a[2]);
    let p2 = cameraSpace(b[0], b[1], b[2]);
    const near = 0.12;
    if (p1.depth <= near && p2.depth <= near) return;

    if (p1.depth <= near || p2.depth <= near) {
      const t = (near - p1.depth) / (p2.depth - p1.depth);
      const intersection = {
        right: p1.right + (p2.right - p1.right) * t,
        up: p1.up + (p2.up - p1.up) * t,
        depth: near + 0.001
      };
      if (p1.depth <= near) p1 = intersection;
      else p2 = intersection;
    }

    const screen1 = projectCameraPoint(p1);
    const screen2 = projectCameraPoint(p2);
    if (!screen1 || !screen2) return;
    ctx.beginPath();
    ctx.moveTo(screen1.x, screen1.y);
    ctx.lineTo(screen2.x, screen2.y);
    ctx.strokeStyle = color;
    ctx.lineWidth = lineWidth;
    ctx.stroke();
  }

  // ------------------------------------------------------------
  // 넓은 회색 바닥: 플레이어를 중심으로 한 큰 평면을 카메라 앞쪽만 잘라 투영
  // ------------------------------------------------------------
  function drawFloor() {
    const radius = 400;
    const worldCorners = [
      [player.x - radius, 0, player.z - radius],
      [player.x + radius, 0, player.z - radius],
      [player.x + radius, 0, player.z + radius],
      [player.x - radius, 0, player.z + radius]
    ];

    const cameraCorners = worldCorners.map(point =>
      cameraSpace(point[0], point[1], point[2])
    );
    const clipped = clipPolygonToNearPlane(cameraCorners);
    const screenCorners = clipped.map(projectCameraPoint).filter(Boolean);

    if (screenCorners.length >= 3) {
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(screenCorners[0].x, screenCorners[0].y);
      for (let i = 1; i < screenCorners.length; i++) {
        ctx.lineTo(screenCorners[i].x, screenCorners[i].y);
      }
      ctx.closePath();
      ctx.fillStyle = '#85898e';
      ctx.fill();
      ctx.restore();
    }

    // 바닥 격자선도 near plane에서 잘라 그려 시선을 위/아래로 돌려도 끊기지 않게 합니다.
    const gridRange = 100;
    const gridStep = 4;
    ctx.save();
    for (let offset = -gridRange; offset <= gridRange; offset += gridStep) {
      drawLine3D(
        [player.x + offset, 0, player.z - gridRange],
        [player.x + offset, 0, player.z + gridRange],
        'rgba(55,60,66,0.25)', 1
      );
      drawLine3D(
        [player.x - gridRange, 0, player.z + offset],
        [player.x + gridRange, 0, player.z + offset],
        'rgba(55,60,66,0.25)', 1
      );
    }
    ctx.restore();
  }

  function shade(hex, factor) {
    const value = parseInt(hex.slice(1), 16);
    const r = Math.min(255, Math.round(((value >> 16) & 255) * factor));
    const g = Math.min(255, Math.round(((value >> 8) & 255) * factor));
    const b = Math.min(255, Math.round((value & 255) * factor));
    return `rgb(${r},${g},${b})`;
  }

  function drawCube(obj) {
    const { x, z, size, color } = obj;
    const s = size / 2;
    const vertices = [
      [x-s,0,z-s], [x+s,0,z-s], [x+s,size,z-s], [x-s,size,z-s],
      [x-s,0,z+s], [x+s,0,z+s], [x+s,size,z+s], [x-s,size,z+s]
    ];
    const points = vertices.map(point => project(point[0], point[1], point[2]));
    const faces = [
      { ids:[0,1,2,3], light:0.72 }, { ids:[4,5,6,7], light:0.95 },
      { ids:[0,1,5,4], light:0.82 }, { ids:[3,2,6,7], light:1.08 },
      { ids:[0,3,7,4], light:0.68 }, { ids:[1,2,6,5], light:0.9 }
    ];
    const visibleFaces = [];
    for (const face of faces) {
      if (face.ids.some(index => !points[index])) continue;
      const depth = face.ids.reduce((sum, index) => sum + points[index].depth, 0) / face.ids.length;
      visibleFaces.push({ ...face, depth });
    }
    visibleFaces.sort((a, b) => b.depth - a.depth);
    for (const face of visibleFaces) {
      ctx.beginPath();
      const first = points[face.ids[0]];
      ctx.moveTo(first.x, first.y);
      for (let i = 1; i < face.ids.length; i++) {
        const point = points[face.ids[i]];
        ctx.lineTo(point.x, point.y);
      }
      ctx.closePath();
      ctx.fillStyle = shade(color, face.light);
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.25)';
      ctx.lineWidth = 1;
      ctx.stroke();
    }
  }

  function drawProjectile(projectile) {
    const point = project(projectile.x, projectile.y, projectile.z);
    if (!point) return;

    const previous = project(projectile.previousX, projectile.previousY, projectile.previousZ);
    const radius = Math.max(2.5, Math.min(18, point.scale * projectileRadius));

    if (previous) {
      ctx.beginPath();
      ctx.moveTo(previous.x, previous.y);
      ctx.lineTo(point.x, point.y);
      ctx.strokeStyle = 'rgba(255,45,45,0.72)';
      ctx.lineWidth = Math.max(2, radius * 0.9);
      ctx.lineCap = 'round';
      ctx.stroke();
    }

    const glow = ctx.createRadialGradient(
      point.x, point.y, 0,
      point.x, point.y, radius * 2.8
    );
    glow.addColorStop(0, 'rgba(255,255,220,1)');
    glow.addColorStop(0.22, 'rgba(255,65,65,0.98)');
    glow.addColorStop(1, 'rgba(255,0,0,0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(point.x, point.y, radius * 2.8, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#ff2424';
    ctx.beginPath();
    ctx.arc(point.x, point.y, radius, 0, Math.PI * 2);
    ctx.fill();
  }

  function updateProjectiles(dt) {
    fireCooldown = Math.max(0, fireCooldown - dt);

    for (let i = projectiles.length - 1; i >= 0; i--) {
      const projectile = projectiles[i];
      projectile.previousX = projectile.x;
      projectile.previousY = projectile.y;
      projectile.previousZ = projectile.z;

      projectile.x += projectile.vx * dt;
      projectile.y += projectile.vy * dt;
      projectile.z += projectile.vz * dt;
      projectile.life -= dt;

      // 블록에 맞으면 블록을 제거하고 명중 수를 올립니다.
      let hitIndex = -1;
      for (let j = 0; j < objects.length; j++) {
        const obj = objects[j];
        const half = obj.size / 2 + projectileRadius;
        if (
          projectile.x >= obj.x - half && projectile.x <= obj.x + half &&
          projectile.y >= -projectileRadius && projectile.y <= obj.size + projectileRadius &&
          projectile.z >= obj.z - half && projectile.z <= obj.z + half
        ) {
          hitIndex = j;
          break;
        }
      }

      if (hitIndex >= 0) {
        objects.splice(hitIndex, 1);
        hits += 1;
        hitsLabel.textContent = String(hits);
        projectile.life = 0;
      }

      if (projectile.life <= 0 || Math.hypot(
        projectile.x - player.x,
        projectile.y - (player.y + camera.eyeHeight),
        projectile.z - player.z
      ) > 110) {
        projectiles.splice(i, 1);
      }
    }
  }

  function drawBackground() {
    const gradient = ctx.createLinearGradient(0, 0, 0, height);
    gradient.addColorStop(0, '#111d37');
    gradient.addColorStop(0.62, '#39536b');
    gradient.addColorStop(1, '#647586');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, width, height);
  }

  function update(dt) {
    // 방향키는 카메라 시점 조정에만 사용합니다.
    // 각속도가 즉시 바뀌지 않고 부드럽게 목표 속도에 접근하도록 보간합니다.
    const turn = (keys.ArrowRight ? 1 : 0) - (keys.ArrowLeft ? 1 : 0);
    const look = (keys.ArrowDown ? 1 : 0) - (keys.ArrowUp ? 1 : 0);
    const response = 1 - Math.exp(-camera.rotationResponse * dt);
    const targetYawVelocity = turn * camera.turnSpeed;
    const targetPitchVelocity = look * camera.lookSpeed;

    camera.yawVelocity += (targetYawVelocity - camera.yawVelocity) * response;
    camera.pitchVelocity += (targetPitchVelocity - camera.pitchVelocity) * response;
    camera.yaw += camera.yawVelocity * dt;

    const nextPitch = camera.pitch + camera.pitchVelocity * dt;
    const limitedPitch = Math.max(-1.28, Math.min(1.28, nextPitch));
    if (limitedPitch !== nextPitch) camera.pitchVelocity = 0;
    camera.pitch = limitedPitch;

    // WASD는 플레이어 이동에만 사용합니다.
    let forward = 0;
    let sideways = 0;
    if (keys.KeyW) forward += 1;
    if (keys.KeyS) forward -= 1;
    if (keys.KeyA) sideways -= 1;
    if (keys.KeyD) sideways += 1;

    const length = Math.hypot(forward, sideways);
    if (length > 0) {
      forward /= length;
      sideways /= length;
      const dx = sideways * Math.cos(camera.yaw) + forward * Math.sin(camera.yaw);
      const dz = sideways * Math.sin(camera.yaw) - forward * Math.cos(camera.yaw);
      player.x += dx * player.speed * dt;
      player.z += dz * player.speed * dt;
    }

    // 점프와 중력
    player.y += player.vy * dt;
    player.vy -= 18 * dt;
    if (player.y <= 0) {
      player.y = 0;
      player.vy = 0;
      player.grounded = true;
    }

    updateProjectiles(dt);
    positionLabel.textContent = `위치: ${player.x.toFixed(1)}, ${player.z.toFixed(1)}`;
  }

  let previousTime = performance.now();
  function render(now) {
    const dt = Math.min((now - previousTime) / 1000, 0.04);
    previousTime = now;

    if (gameState === 'playing') update(dt);

    drawBackground();
    drawFloor();

    // 멀리 있는 블록부터 렌더링합니다.
    const sorted = objects.map(obj => {
      const center = project(obj.x, obj.size / 2, obj.z);
      return { obj, depth: center ? center.depth : -Infinity };
    }).filter(item => item.depth > 0).sort((a, b) => b.depth - a.depth);
    for (const item of sorted) drawCube(item.obj);

    // 투사체는 배경과 바닥, 블록 위에 표시합니다.
    for (const projectile of projectiles) drawProjectile(projectile);

    requestAnimationFrame(render);
  }

  showOverlay('ready');
  requestAnimationFrame(render);
})();
</script>
