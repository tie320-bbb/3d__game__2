<style>
  #game-shell {
    position: relative;
    width: 100%;
    height: 740px;
    min-height: 520px;
    overflow: hidden;
    isolation: isolate;
    background: #111827;
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 14px;
    user-select: none;
    -webkit-user-select: none;
  }
  #game-shell * { box-sizing: border-box; }
  #game {
    position: absolute;
    inset: 0;
    display: block;
    width: 100%;
    height: 100%;
    outline: none;
    cursor: crosshair;
    touch-action: none;
  }
  #game-hud {
    position: absolute;
    top: 14px;
    left: 14px;
    z-index: 5;
    color: #fff;
    background: rgba(0,0,0,.58);
    padding: 12px 15px;
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 12px;
    line-height: 1.65;
    font-size: 13px;
    pointer-events: none;
    backdrop-filter: blur(5px);
  }
  #game-hud h2 { margin: 0 0 5px; font-size: 16px; }
  #game-position { color: #a7f3d0; }
  #game-crosshair {
    position: absolute;
    z-index: 4;
    left: 50%;
    top: 50%;
    width: 10px;
    height: 10px;
    transform: translate(-50%, -50%);
    border: 2px solid rgba(255,255,255,.95);
    border-radius: 50%;
    box-shadow: 0 0 3px #000;
    pointer-events: none;
  }
  #game-help {
    position: absolute;
    z-index: 5;
    bottom: 14px;
    left: 50%;
    transform: translateX(-50%);
    color: #fff;
    background: rgba(0,0,0,.58);
    border: 1px solid rgba(255,255,255,.12);
    padding: 9px 14px;
    border-radius: 10px;
    font-size: 12px;
    white-space: nowrap;
    pointer-events: none;
    text-align: center;
  }
  #game-overlay {
    position: absolute;
    inset: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    color: #fff;
    background: rgba(5,10,20,.72);
    backdrop-filter: blur(5px);
  }
  #game-overlay[hidden] { display: none !important; }
  #game-overlay-panel {
    width: min(420px, 100%);
    padding: 28px 26px;
    text-align: center;
    background: rgba(17,29,48,.96);
    border: 1px solid rgba(255,255,255,.16);
    border-radius: 18px;
    box-shadow: 0 18px 60px rgba(0,0,0,.35);
  }
  #game-overlay-kicker {
    display: inline-block;
    margin-bottom: 12px;
    padding: 5px 10px;
    color: #a7f3d0;
    background: rgba(16,185,129,.13);
    border: 1px solid rgba(167,243,208,.22);
    border-radius: 999px;
    font-size: 11px;
    letter-spacing: .08em;
  }
  #game-overlay-title { margin: 0 0 10px; font-size: 25px; }
  #game-overlay-message {
    margin: 0 0 20px;
    color: #d1d5db;
    font-size: 14px;
    line-height: 1.65;
  }
  #game-resume {
    width: 100%;
    padding: 12px 18px;
    color: #06251c;
    background: #6ee7b7;
    border: 0;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }
  #game-resume:hover { background: #a7f3d0; }
  #game-resume:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  #game-overlay-note {
    display: block;
    margin-top: 14px;
    color: #9ca3af;
    font-size: 11px;
    line-height: 1.5;
  }
  #game-status {
    min-height: 18px;
    margin-top: 10px;
    color: #fbbf24;
    font-size: 12px;
  }
  @media (max-width: 600px) {
    #game-shell { height: 680px; min-height: 480px; }
    #game-help { white-space: normal; width: calc(100% - 28px); line-height: 1.5; }
    #game-hud { font-size: 12px; }
  }
</style>

<div id="game-shell">
  <canvas id="game" tabindex="0" aria-label="3D first person game"></canvas>

  <div id="game-hud">
    <h2>🎮 3D WORLD · FPS</h2>
    <div>이동: WASD / 방향키</div>
    <div>점프: SPACE</div>
    <div>시점: 마우스 이동</div>
    <div>일시정지: ESC</div>
    <div id="game-position">위치: 0.0, 0.0</div>
  </div>

  <div id="game-crosshair"></div>
  <div id="game-help">WASD 이동 · SPACE 점프 · 마우스 이동으로 시점 회전 · ESC 일시정지 및 커서 해제</div>

  <div id="game-overlay" role="dialog" aria-modal="true" aria-labelledby="game-overlay-title">
    <div id="game-overlay-panel">
      <div id="game-overlay-kicker">3D FIRST PERSON WORLD</div>
      <h2 id="game-overlay-title">게임을 시작할까요?</h2>
      <p id="game-overlay-message">시작 버튼을 누르면 마우스가 게임 화면에 고정됩니다. 마우스를 움직여 주변을 둘러보세요.</p>
      <button id="game-resume" type="button">게임 시작</button>
      <small id="game-overlay-note">게임 중 ESC를 누르면 일시정지되고 마우스 커서가 해제됩니다.</small>
      <div id="game-status" aria-live="polite"></div>
    </div>
  </div>
</div>

<script>
(() => {
  'use strict';

  const shell = document.getElementById('game-shell');
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const positionLabel = document.getElementById('game-position');
  const overlay = document.getElementById('game-overlay');
  const overlayTitle = document.getElementById('game-overlay-title');
  const overlayMessage = document.getElementById('game-overlay-message');
  const resumeButton = document.getElementById('game-resume');
  const overlayNote = document.getElementById('game-overlay-note');
  const statusLabel = document.getElementById('game-status');

  let width = 0;
  let height = 0;
  let dpr = 1;
  let gameState = 'ready'; // ready | playing | paused

  function resize() {
    const rect = shell.getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    width = Math.max(1, rect.width);
    height = Math.max(1, rect.height);
    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  if (typeof ResizeObserver !== 'undefined') {
    new ResizeObserver(resize).observe(shell);
  }
  window.addEventListener('resize', resize);
  resize();

  const player = {
    x: 0,
    z: 0,
    y: 0,
    vy: 0,
    speed: 6.0,
    grounded: true
  };

  // yaw=0일 때 -Z 방향을 바라봅니다. pitch가 양수면 아래를 바라봅니다.
  const camera = {
    yaw: 0,
    pitch: 0.17,
    eyeHeight: 1.65,
    sensitivity: 0.0024
  };

  const keys = Object.create(null);
  const movementCodes = new Set([
    'KeyW', 'KeyA', 'KeyS', 'KeyD',
    'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'
  ]);

  function clearKeys() {
    for (const key of Object.keys(keys)) keys[key] = false;
  }

  function showOverlay(mode, message = '') {
    overlay.hidden = false;
    statusLabel.textContent = message;

    if (mode === 'ready') {
      overlayTitle.textContent = '게임을 시작할까요?';
      overlayMessage.textContent = '시작 버튼을 누르면 마우스가 게임 화면에 고정됩니다. 마우스를 움직여 주변을 둘러보세요.';
      resumeButton.textContent = '게임 시작';
      overlayNote.textContent = '게임 중 ESC를 누르면 일시정지되고 마우스 커서가 해제됩니다.';
    } else {
      overlayTitle.textContent = '일시정지';
      overlayMessage.textContent = '게임이 멈췄습니다. 계속하기를 누르면 마우스가 다시 고정되고 이어서 플레이합니다.';
      resumeButton.textContent = '계속하기';
      overlayNote.textContent = '게임 화면 밖으로 커서를 이동하거나 다른 곳을 클릭할 수 있습니다.';
    }
  }

  function pauseGame() {
    if (gameState !== 'playing') return;
    gameState = 'paused';
    clearKeys();
    showOverlay('paused');
    if (document.pointerLockElement === canvas) {
      document.exitPointerLock();
    }
  }

  function requestGameLock() {
    if (document.pointerLockElement === canvas) return;
    statusLabel.textContent = '';
    canvas.focus({ preventScroll: true });

    if (typeof canvas.requestPointerLock !== 'function') {
      statusLabel.textContent = '이 브라우저에서는 마우스 고정을 지원하지 않습니다.';
      return;
    }

    try {
      const result = canvas.requestPointerLock();
      // 최신 브라우저는 Promise를 반환하고, 일부 브라우저는 undefined를 반환합니다.
      if (result && typeof result.catch === 'function') {
        result.catch(() => {
          statusLabel.textContent = '마우스 고정이 차단되었습니다. 게임 화면을 다시 클릭해 주세요.';
        });
      }
    } catch (error) {
      statusLabel.textContent = '마우스 고정을 시작하지 못했습니다. 게임 화면을 다시 클릭해 주세요.';
    }
  }

  resumeButton.addEventListener('click', requestGameLock);
  overlay.addEventListener('click', (event) => {
    if (event.target === overlay || event.target === overlayMessage || event.target === overlayTitle) {
      requestGameLock();
    }
  });
  canvas.addEventListener('click', requestGameLock);

  document.addEventListener('pointerlockchange', () => {
    if (document.pointerLockElement === canvas) {
      gameState = 'playing';
      overlay.hidden = true;
      statusLabel.textContent = '';
      canvas.focus({ preventScroll: true });
    } else if (gameState === 'playing') {
      // ESC, 브라우저 탭 전환 등으로 포인터 잠금이 풀리면 자동 일시정지합니다.
      pauseGame();
    }
  });

  document.addEventListener('pointerlockerror', () => {
    statusLabel.textContent = '마우스 제어를 시작하지 못했습니다. 게임 시작 버튼을 다시 눌러 주세요.';
    showOverlay(gameState === 'ready' ? 'ready' : 'paused', statusLabel.textContent);
  });

  // 포인터 잠금 중에는 마우스의 상대 이동량(movementX/Y)으로 FPS 시점을 회전합니다.
  document.addEventListener('mousemove', (event) => {
    if (gameState !== 'playing' || document.pointerLockElement !== canvas) return;
    camera.yaw += event.movementX * camera.sensitivity;
    camera.pitch += event.movementY * camera.sensitivity;
    camera.pitch = Math.max(-0.55, Math.min(0.78, camera.pitch));
  });

  document.addEventListener('keydown', (event) => {
    if (event.code === 'Escape') {
      if (gameState === 'playing') {
        event.preventDefault();
        pauseGame();
      }
      return;
    }

    if (gameState !== 'playing') return;
    if (movementCodes.has(event.code)) event.preventDefault();
    keys[event.code] = true;

    if (event.code === 'Space' && !event.repeat && player.grounded) {
      player.vy = 7.2;
      player.grounded = false;
    }
  });

  document.addEventListener('keyup', (event) => {
    keys[event.code] = false;
  });

  window.addEventListener('blur', clearKeys);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && gameState === 'playing') pauseGame();
  });

  const palette = ['#e85d75', '#55aaff', '#f5c542', '#9b72cf', '#38bdf8', '#fb923c'];
  const objects = [];
  for (let i = 0; i < 42; i++) {
    let x, z;
    do {
      x = (Math.random() - 0.5) * 58;
      z = (Math.random() - 0.5) * 58;
    } while (Math.hypot(x, z) < 7);
    objects.push({
      x,
      z,
      size: 0.9 + Math.random() * 1.8,
      color: palette[i % palette.length]
    });
  }

  function project(x, y, z) {
    const dx = x - player.x;
    const dy = y - (player.y + camera.eyeHeight);
    const dz = z - player.z;
    const sy = Math.sin(camera.yaw);
    const cy = Math.cos(camera.yaw);
    const sp = Math.sin(camera.pitch);
    const cp = Math.cos(camera.pitch);
    const right = dx * cy + dz * sy;
    const up = -dx * sy * sp + dy * cp + dz * cy * sp;
    const depth = dx * sy * cp - dy * sp - dz * cy * cp;
    if (depth <= 0.12) return null;
    const focal = height / (2 * Math.tan(70 * Math.PI / 360));
    const scale = focal / depth;
    return {
      x: width / 2 + right * scale,
      y: height / 2 - up * scale,
      depth,
      scale
    };
  }

  function drawLine3D(a, b, color, lineWidth = 1) {
    const p1 = project(a[0], a[1], a[2]);
    const p2 = project(b[0], b[1], b[2]);
    if (!p1 || !p2) return;
    ctx.beginPath();
    ctx.moveTo(p1.x, p1.y);
    ctx.lineTo(p2.x, p2.y);
    ctx.strokeStyle = color;
    ctx.lineWidth = lineWidth;
    ctx.stroke();
  }

  function floorPoint(distance, side) {
    const sy = Math.sin(camera.yaw);
    const cy = Math.cos(camera.yaw);
    const forwardX = sy;
    const forwardZ = -cy;
    const rightX = cy;
    const rightZ = sy;
    return [
      player.x + forwardX * distance + rightX * side,
      0,
      player.z + forwardZ * distance + rightZ * side
    ];
  }

  function drawFloor() {
    const corners = [
      floorPoint(0.8, -150), floorPoint(170, -150),
      floorPoint(170, 150), floorPoint(0.8, 150)
    ].map(point => project(point[0], point[1], point[2]));

    if (corners.every(Boolean)) {
      ctx.beginPath();
      ctx.moveTo(corners[0].x, corners[0].y);
      for (let i = 1; i < corners.length; i++) {
        ctx.lineTo(corners[i].x, corners[i].y);
      }
      ctx.closePath();
      ctx.fillStyle = '#85898e';
      ctx.fill();
    }

    for (let distance = 2; distance <= 100; distance += 2) {
      drawLine3D(
        floorPoint(distance, -100), floorPoint(distance, 100),
        'rgba(55,60,66,0.27)', 1
      );
    }
    for (let side = -100; side <= 100; side += 2) {
      drawLine3D(
        floorPoint(1, side), floorPoint(110, side),
        'rgba(55,60,66,0.27)', 1
      );
    }
  }

  function shade(hex, factor) {
    const value = parseInt(hex.slice(1), 16);
    const r = Math.min(255, Math.round(((value >> 16) & 255) * factor));
    const g = Math.min(255, Math.round(((value >> 8) & 255) * factor));
    const b = Math.min(255, Math.round((value & 255) * factor));
    return `rgb(${r},${g},${b})`;
  }

  function drawCube(obj) {
    const { x, z, size, color } = obj;
    const s = size / 2;
    const vertices = [
      [x-s,0,z-s], [x+s,0,z-s], [x+s,size,z-s], [x-s,size,z-s],
      [x-s,0,z+s], [x+s,0,z+s], [x+s,size,z+s], [x-s,size,z+s]
    ];
    const points = vertices.map(point => project(point[0], point[1], point[2]));
    const faces = [
      { ids:[0,1,2,3], light:0.72 }, { ids:[4,5,6,7], light:0.95 },
      { ids:[0,1,5,4], light:0.82 }, { ids:[3,2,6,7], light:1.08 },
      { ids:[0,3,7,4], light:0.68 }, { ids:[1,2,6,5], light:0.9 }
    ];
    const visibleFaces = [];
    for (const face of faces) {
      if (face.ids.some(index => !points[index])) continue;
      const depth = face.ids.reduce((sum, index) => sum + points[index].depth, 0) / face.ids.length;
      visibleFaces.push({ ...face, depth });
    }
    visibleFaces.sort((a, b) => b.depth - a.depth);
    for (const face of visibleFaces) {
      ctx.beginPath();
      const first = points[face.ids[0]];
      ctx.moveTo(first.x, first.y);
      for (let i = 1; i < face.ids.length; i++) {
        const point = points[face.ids[i]];
        ctx.lineTo(point.x, point.y);
      }
      ctx.closePath();
      ctx.fillStyle = shade(color, face.light);
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.25)';
      ctx.lineWidth = 1;
      ctx.stroke();
    }
  }

  function drawBackground() {
    const gradient = ctx.createLinearGradient(0, 0, 0, height);
    gradient.addColorStop(0, '#111d37');
    gradient.addColorStop(0.62, '#39536b');
    gradient.addColorStop(1, '#647586');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, width, height);
  }

  function update(dt) {
    let forward = 0;
    let sideways = 0;
    if (keys.KeyW || keys.ArrowUp) forward += 1;
    if (keys.KeyS || keys.ArrowDown) forward -= 1;
    if (keys.KeyA || keys.ArrowLeft) sideways -= 1;
    if (keys.KeyD || keys.ArrowRight) sideways += 1;

    const length = Math.hypot(forward, sideways);
    if (length > 0) {
      forward /= length;
      sideways /= length;
      const dx = sideways * Math.cos(camera.yaw) + forward * Math.sin(camera.yaw);
      const dz = sideways * Math.sin(camera.yaw) - forward * Math.cos(camera.yaw);
      player.x += dx * player.speed * dt;
      player.z += dz * player.speed * dt;
    }

    player.y += player.vy * dt;
    player.vy -= 18 * dt;
    if (player.y <= 0) {
      player.y = 0;
      player.vy = 0;
      player.grounded = true;
    }

    positionLabel.textContent = `위치: ${player.x.toFixed(1)}, ${player.z.toFixed(1)}`;
  }

  let previousTime = performance.now();
  function render(now) {
    const dt = Math.min((now - previousTime) / 1000, 0.04);
    previousTime = now;

    if (gameState === 'playing') update(dt);

    drawBackground();
    drawFloor();

    const sorted = objects.map(obj => {
      const center = project(obj.x, obj.size / 2, obj.z);
      return { obj, depth: center ? center.depth : -Infinity };
    }).filter(item => item.depth > 0).sort((a, b) => b.depth - a.depth);

    for (const item of sorted) drawCube(item.obj);
    requestAnimationFrame(render);
  }

  showOverlay('ready');
  requestAnimationFrame(render);
})();
</script>
